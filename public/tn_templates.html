<!-- TN Legacy Templates - Extracted from main_form/1_category.html through 5_summary.html -->
<!-- These templates preserve the exact markup, IDs, and classes from the legacy forms -->

<template id="tn-step-1">
  <div class="card">
    <!-- Team Count Section - populated by createTeamCountSelector() -->
    <div id="teamCountSection">
      <!-- Content will be generated dynamically by initStep1() -->
    </div>
  </div>
</template>

<template id="tn-step-2">
  <div class="card">
    <form id="teamInfoForm">
      <h2 data-i18n="teamInformation">Team Information</h2>

      <div id="teamNameFields"></div>
      <div class="form-group">
        <label for="orgName" data-i18n="organizationGroupName">Organization / Group Name *</label>
        <input type="text" id="orgName" name="orgName" placeholder="" data-i18n-placeholder="enterOrgName" required />
      </div>
      <div class="form-group">
        <label for="mailingAddress" data-i18n="mailingAddress">Mailing Address *</label>
        <textarea id="mailingAddress" name="mailingAddress" rows="3" placeholder="Room/Floor, Building Name, Street, District, City" data-i18n-placeholder="addressPlaceholder" required></textarea>
      </div>
      <h3 data-i18n="teamManagerContact">Team Manager Contact</h3>
      <div id="managerFields"></div>

      <p class="msg" id="formMsg"></p>
      <!-- Navigation -->
      <div class="nav-buttons" style="display: flex; justify-content: space-between; gap: 1rem;">
        <button type="button" id="backBtn" data-i18n="backButton">← Back</button>
        <button type="submit" id="nextBtn" data-i18n="nextButton">Next →</button>
      </div>
    </form>
  </div>
</template>

<!-- Step 3: Race Day Arrangements Template
     IMPORTANT: This is the ONLY Step 3 template. Do not create duplicates.
     Navigation buttons use IDs: backBtn, nextBtn (matching setupStep3Navigation)
-->
<template id="tn-step-3">
  <div class="card">
    <form id="raceDayForm">
      <h2 data-i18n="raceDayArrangement">Race Day Arrangement</h2>

      <!-- Athlete Marquee -->
      <div class="form-group">
        <label for="marqueeQty" data-i18n="athleteMarquee">Athlete Marquee</label>
        <div class="qty-input-container">
          <input type="number" id="marqueeQty" name="marqueeQty" class="qty-input" min="0" max="25" value="0" />
          <span class="unit-label" data-i18n="unitPrice">Unit Price:</span>
          <span class="price" id="marqueePrice">HK$200</span>
        </div>
      </div>

      <!-- Per-Team Official Steersman Selection -->
      <div class="steersman-per-team-section">
        <h4>Official Steersman For Race Day</h4>
        <div id="steersmanCardsContainer"></div>
      </div>

      <div class="section">
        <h3 data-i18n="junkRegistration">Junk Registration</h3>
        <div class="line-row">
          <span id="junkPrice">HK$2,500</span> <!-- Fallback if config not loaded; overwritten by live config when available. -->
          <input type="number" id="junkBoatQty" name="junkBoatQty" class="qty-input" min="0" max="25" value="0"/>
          <div id="junkBoatLicenseContainer" class="license-fields-container"></div>
        </div>
      </div>

      <div class="section">
        <h3 data-i18n="speedBoatRegistration">Speed Boat Registration</h3>
        <div class="line-row">
          <span id="speedPrice">HK$1,500</span> <!-- Fallback if config not loaded; overwritten by live config when available. -->
          <input type="number" id="speedboatQty" name="speedboatQty" class="qty-input" min="0" max="25" value="0"/>
          <div id="speedBoatLicenseContainer" class="license-fields-container"></div>
        </div>
      </div>

      <p class="msg" id="formMsg"></p>
      <!-- Navigation -->
      <div class="nav-buttons">
        <button type="button" id="backBtn" data-i18n="backButton">← Back</button>
        <button type="submit" id="nextBtn" data-i18n="nextButton">Next →</button>
      </div>
    </form>
  </div>
</template>

<!-- Step 4: Practice Booking Template
     IMPORTANT: This is the ONLY Step 4 template. Do not create duplicates.
     Navigation buttons use IDs: backBtn, nextBtn (matching setupStep4Navigation)
-->
<template id="tn-step-4">
  <div class="card calendar-modern">

    <h2 data-i18n="practiceBookingTitleFallback">Practice Booking (Jan–Jul 2026)</h2> <!-- Fallback if config not loaded; overwritten by live config when available. -->

    <!-- Team Selection -->
    <div class="team-selector">
      <label for="teamSelect" data-i18n="selectTeamLabel">Select Team:</label>
      <select id="teamSelect"></select>
    </div>
    <div id="teamNameFields"></div>

    <div class="copy-from-team1" style="margin-top: 0.5rem;">
      <button type="button" id="copyFromTeam1Btn" data-i18n="copyFromTeam1">Copy from Team 1</button>
    </div>

    <!-- Single Calendar Container -->
    <div id="calendarContainer" class="calendar-wrapper">
      <div class="calendar-container">
        <div class="calendar-header">
          <button class="nav-btn" id="prevMonthBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
          
          <div class="month-year-selector">
            <select class="month-dropdown" id="monthDropdown">
              <!-- Populated by JS -->
            </select>
            <select class="year-dropdown" id="yearDropdown">
              <option value="2026">2026</option>
            </select>
          </div>

          <button class="nav-btn" id="nextMonthBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18l6-6-6-6"/>
            </svg>
          </button>
        </div>

        <div class="calendar-grid">
          <div class="weekdays" id="weekdayHeaders">
            <!-- Populated by JS -->
          </div>
          <div class="days-grid" id="daysGrid">
            <!-- Populated by JS -->
          </div>
        </div>
      </div>

      <!-- Selected Dates Panel -->
      <div class="selected-dates-panel">
        <div class="panel-header">
          <div class="panel-title-wrapper">
            <span data-i18n="selectedPracticeDates">Selected Practice Dates</span>
            <p class="panel-instructions" data-i18n="practiceInstructions">Please select Practice Duration (1 Hour / 2 Hours) and Trainer & Steersman Needs (Steersman only / Coach only / Steersman and Coach / None) for each practice date.</p>
          </div>
          <button class="clear-all-btn" type="button" id="clearAllDatesBtn" data-i18n="clearAll">Clear All</button>
        </div>
        <div class="selected-dates-list" id="selectedDatesList">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
    
    <!-- Error divs for practice validation (per team, dynamically shown/hidden) -->
    <div id="error-practice-team-1" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-1" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-1" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-practice-team-2" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-2" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-2" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-practice-team-3" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-3" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-3" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-practice-team-4" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-4" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-4" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-practice-team-5" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-5" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-5" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-practice-team-6" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-6" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-6" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-practice-team-7" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-7" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-7" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-practice-team-8" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-8" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-8" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-practice-team-9" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-9" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-9" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-practice-team-10" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-duration-team-10" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>
    <div id="error-helper-team-10" class="field-error" role="alert" aria-live="polite" style="display: none;"></div>

    <!-- Time Slot Preference -->
    <div class="slot-preferences">
      <h3 data-i18n="timeSlotPreferenceRanking">Time Slot Preference Ranking</h3>

      <table class="slot-table">
        <thead>
          <tr>
            <th data-i18n="rank">Rank</th>
            <th data-i18n="twoHourSession">2-Hour Session</th>
            <th data-i18n="oneHourSession">1-Hour Session</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td data-i18n="firstChoice">1st Choice</td>
            <td><select id="slotPref2h_1" required><option value="" data-i18n="selectPlaceholder">-- Select --</option></select></td>
            <td><select id="slotPref1h_1"><option value="" data-i18n="selectPlaceholder">-- Select --</option></select></td>
          </tr>
          <tr>
            <td data-i18n="secondChoice">2nd Choice</td>
            <td><select id="slotPref2h_2"><option value="" data-i18n="selectPlaceholder">-- Select --</option></select></td>
            <td><select id="slotPref1h_2"><option value="" data-i18n="selectPlaceholder">-- Select --</option></select></td>
          </tr>
          <tr>
            <td data-i18n="thirdChoice">3rd Choice</td>
            <td><select id="slotPref2h_3"><option value="" data-i18n="selectPlaceholder">-- Select --</option></select></td>
            <td><select id="slotPref1h_3"><option value="" data-i18n="selectPlaceholder">-- Select --</option></select></td>
          </tr>
        </tbody>
      </table>
    </div>




    <!-- Practice Summary (Combined) -->
    <div id="practiceSummary" class="summary-box">
      <h3 data-i18n="practiceBookingSummary">Practice Booking Summary</h3>
      <p><span data-i18n="totalHoursSelected">Total Hours Selected:</span> <span id="totalHours">0</span> / 12</p>
      <p><span data-i18n="extraPracticeSessions">Extra Practice Sessions</span> <span id="priceExtraStd">HK$600</span> <span data-i18n="perSession">/ per session</span>: <span id="extraPracticeQty">0</span></p> <!-- Fallback if config not loaded; overwritten by live config when available. -->
      <p><span data-i18n="trainerSessions">Trainer Sessions</span> <span id="priceTrainer">HK$550</span> <span data-i18n="perSession">/ per session</span>: <span id="trainerQty">0</span></p> <!-- Fallback if config not loaded; overwritten by live config when available. -->
      <p><span data-i18n="steersmanSessions">Steersman Sessions</span> <span id="priceSteersman">HK$350</span> <span data-i18n="perSession">/ per session</span>: <span id="steersmanQty">0</span></p> <!-- Fallback if config not loaded; overwritten by live config when available. -->
    </div>

    <!-- Navigation Buttons - CRITICAL: These IDs (backBtn, nextBtn) must match setupStep4Navigation() -->
    <div class="nav-buttons">
      <button type="button" id="backBtn" data-i18n="backButton">← Back</button>
      <button type="button" id="nextBtn" data-i18n="nextButton">Next →</button>
    </div>

  </div>
</template>

<template id="tn-step-5">
  <div class="wrap">
    <h1 data-i18n="applicationSummary">Application Summary</h1>

    <div class="section" id="secBasics">
      <h2 data-i18n="basics">Basics</h2>
      <div class="grid-2">
        <div class="kv"><div class="k" data-i18n="season">Season</div><div class="v" id="sumSeason">—</div></div>
        <div class="kv"><div class="k" data-i18n="organization">Organization</div><div class="v" id="sumOrg">—</div></div>
        <div class="kv"><div class="k" data-i18n="mailingAddress">Mailing Address</div><div class="v" id="sumAddress">—</div></div>
      </div>
    </div>

    <div class="section" id="secTeams">
      <h2 data-i18n="teams">Teams</h2>
      <table class="summary" id="teamsTable">
        <thead>
          <tr>
            <th data-i18n="numberSymbol">#</th>
            <th data-i18n="teamName">Team Name</th>
            <th data-i18n="entryOption">Entry Option</th>
          </tr>
        </thead>
        <tbody id="teamsTbody"><tr><td colspan="3" class="muted" data-i18n="noTeams">No teams</td></tr></tbody>
      </table>
      <div class="muted" style="margin-top:6px;" data-i18n="teamCodesAssignedNote">(Team codes are assigned at submit time.)</div>
    </div>

    <div class="section" id="secManagers">
      <h2 data-i18n="teamManagers">Team Managers</h2>
      <table class="summary" id="managersTable">
        <thead>
          <tr>
            <th data-i18n="numberSymbol">#</th>
            <th data-i18n="name">Name</th>
            <th data-i18n="mobile">Mobile</th>
            <th data-i18n="email">Email</th>
          </tr>
        </thead>
        <tbody id="managersTbody"><tr><td colspan="4" class="muted" data-i18n="noManagerInformation">No manager information</td></tr></tbody>
      </table>
    </div>

    <div class="section" id="secRaceDay">
      <h2 data-i18n="raceDayArrangement">Race Day Arrangement</h2>
      <div class="grid-2" id="raceDayGrid">
        <div class="kv"><div class="k" data-i18n="marqueeQty">Marquee Qty</div><div class="v" id="sumMarquee">—</div></div>
        <div class="kv"><div class="k" data-i18n="officialSteersman">Official Steersman</div><div class="v" id="sumSteerWith">—</div></div>
        <div class="kv"><div class="k" data-i18n="junkBoatQty">Junk Boat # / Qty</div><div class="v" id="sumJunk">—</div></div>
        <div class="kv"><div class="k" data-i18n="speedBoatQty">Speed Boat # / Qty</div><div class="v" id="sumSpeed">—</div></div>
      </div>
    </div>

    <div class="section" id="secPractice">
      <h2 data-i18n="practiceBookingPerTeam">Practice Booking (per Team)</h2>
      <div id="perTeamPracticeSummary">
        <p class="muted" data-i18n="noPracticeBookingData">No practice booking data.</p>
      </div>
    </div>

    <div class="section" id="secPricing">
      <h2 data-i18n="costSummary">Cost Summary</h2>
      <table class="summary pricing-table" id="pricingTable">
        <thead>
          <tr>
            <th data-i18n="item">Item</th>
            <th data-i18n="quantity">Quantity</th>
            <th data-i18n="unitPrice">Unit Price</th>
            <th class="text-right" data-i18n="amount">Amount</th>
          </tr>
        </thead>
        <tbody id="pricingTbody">
          <tr><td colspan="4" class="muted" data-i18n="calculating">Calculating...</td></tr>
        </tbody>
        <tfoot>
          <tr class="total-row">
            <td colspan="3" class="text-right"><strong data-i18n="total">Total</strong></td>
            <td class="text-right"><strong id="pricingTotal">HK$0</strong></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <p class="msg" id="formMsg"></p>
    <div class="actions">
      <button type="button" id="backBtn" data-i18n="backButton">← Back</button>
      <button id="submitBtn" data-i18n="submitButton">Submit Application</button>
    </div>
    
    <!-- Confirmation section (hidden by default) -->
    <div id="confirmation" style="display:none;"></div>
    
    <!-- Revisit confirmation section -->
    <div id="revisit"></div>
  </div>
</template>
