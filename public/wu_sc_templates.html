<!-- WU/SC Multi-Step Templates - Based on TN structure but with custom Step 1 for boat type/division selection -->

<template id="wu-sc-step-1">
  <div class="card">
    <form id="categoryForm">
      <h2 data-i18n="selectTeamDetails">Team Details</h2>

      <label for="teamCount" data-i18n="howManyTeamsQuestion">How many teams do you want to register?</label>
      <select id="teamCount" name="teamCount" required>
        <option value="" data-i18n="selectNumberOfTeams">-- Select number of teams --</option>
        <!-- Options will be generated dynamically in initStep1() -->
      </select>

      <hr />

      <div id="teamDetailsContainer" hidden>
        <div id="teamDetailsList"></div>
      </div>

      <!-- Honeypot field -->
      <input type="text" name="website" id="website_hp" autocomplete="off" tabindex="-1" style="position:absolute;left:-9999px;" />

      <p class="msg" id="formMsg"></p>
      <!-- Navigation -->
      <div class="nav-buttons" id="step1Actions" style="display: flex; justify-content: space-between; gap: 1rem; visibility: hidden;">
        <button type="button" id="backToRaceInfo" data-i18n="backButton">← Back</button>
        <button type="submit" id="nextBtn" data-i18n="nextButton">Next →</button>
      </div>
    </form>
  </div>
</template>

<template id="wu-sc-step-2">
  <div class="card">
    <form id="teamInfoForm">
      <h2 data-i18n="teamInformation">Team Information</h2>

      <div id="teamNameFields"></div>
      <div class="form-group">
        <label for="orgName" data-i18n="organizationGroupName">Organization / Group Name*</label>
        <input type="text" id="orgName" name="orgName" placeholder="" data-i18n-placeholder="enterOrgName" required />
      </div>
      <div class="form-group">
        <label for="mailingAddress" data-i18n="mailingAddress">Mailing Address*</label>
        <textarea id="mailingAddress" name="mailingAddress" rows="3" placeholder="Room/Floor, Building Name, Street, District, City" data-i18n-placeholder="addressPlaceholder" required></textarea>
      </div>
      <h3 data-i18n="teamManagerContact">Team Manager Contact</h3>
      <div id="managerFields"></div>

      <p class="msg" id="formMsg"></p>
      <!-- Navigation -->
      <div class="nav-buttons" style="display: flex; justify-content: space-between; gap: 1rem;">
        <button type="button" id="backBtn" data-i18n="backButton">← Back</button>
        <button type="submit" id="nextBtn" data-i18n="nextButton">Next →</button>
      </div>
    </form>
  </div>
</template>

<template id="wu-sc-step-3">
  <div class="card">
    <form id="raceDayForm">
      <h2 data-i18n="raceDayArrangement">Race Day Arrangement</h2>

      <div class="section">
        <h3 data-i18n="athleteMarquee">Athlete Marquee</h3>
        <div class="line-row">
          <span id="marqueePrice"><span data-i18n="unitPrice">Unit Price:</span> HK$800</span>
          <input type="number" id="marqueeQty" name="marqueeQty" min="0" max="25" value="0" />
        </div>
      </div>

      <!-- Per-Team Official Steersman Selection -->
      <div class="steersman-per-team-section">
        <h4>Official Steersman For Race Day</h4>
        <div id="steersmanCardsContainer"></div>
      </div>

      <div class="section">
        <h3 data-i18n="junkRegistration">Junk Registration</h3>
        <div class="line-row">
          <span id="junkPrice">HK$2,500</span>
          <input type="number" id="junkBoatQty" name="junkBoatQty" min="0" max="25" value="0"/>
        </div>
        <div id="junkBoatLicenseContainer" style="margin-top: 0.5rem;"></div>
      </div>

      <div class="section">
        <h3 data-i18n="speedBoatRegistration">Speed Boat Registration</h3>
        <div class="line-row">
          <span id="speedPrice">HK$1,500</span>
          <input type="number" id="speedboatQty" name="speedboatQty" min="0" max="25" value="0"/>
        </div>
        <div id="speedBoatLicenseContainer" style="margin-top: 0.5rem;"></div>
      </div>

      <p class="msg" id="formMsg"></p>
      <!-- Navigation -->
      <div class="nav-buttons" style="display: flex; justify-content: space-between; gap: 1rem;">
        <button type="button" id="backBtn" data-i18n="backButton">← Back</button>
        <button type="submit" id="nextBtn" data-i18n="nextButton">Next →</button>
      </div>
    </form>
  </div>
</template>

<template id="wu-sc-step-4">
  <div class="wrap">
    <h1 data-i18n="applicationSummary">Application Summary</h1>

    <div class="section" id="secBasics">
      <h2 data-i18n="basics">Basics</h2>
      <div class="grid-2">
        <div class="kv"><div class="k" data-i18n="season">Season</div><div class="v" id="sumSeason">—</div></div>
        <div class="kv"><div class="k" data-i18n="organization">Organization</div><div class="v" id="sumOrg">—</div></div>
        <div class="kv"><div class="k" data-i18n="mailingAddress">Mailing Address</div><div class="v" id="sumAddress">—</div></div>
      </div>
    </div>

    <div class="section" id="secTeams">
      <h2 data-i18n="teams">Teams</h2>
      <table class="summary" id="teamsTable">
        <thead>
          <tr>
            <th data-i18n="numberSymbol">#</th>
            <th data-i18n="teamName">Team Name</th>
            <th data-i18n="division">Division</th>
            <th data-i18n="entryGroup">Entry Group</th>
          </tr>
        </thead>
        <tbody id="teamsTbody"><tr><td colspan="4" class="muted" data-i18n="noTeams">No teams</td></tr></tbody>
      </table>
    </div>

    <div class="section" id="secManagers">
      <h2 data-i18n="teamManagerContact">Team Manager Contact</h2>
      <div class="grid-2">
        <div class="kv"><div class="k" data-i18n="teamManager1Required">Manager 1</div><div class="v" id="sumManager1">—</div></div>
        <div class="kv"><div class="k" data-i18n="teamManager2Required">Manager 2</div><div class="v" id="sumManager2">—</div></div>
        <div class="kv"><div class="k" data-i18n="teamManager3Optional">Manager 3</div><div class="v" id="sumManager3">—</div></div>
      </div>
    </div>

    <div class="section" id="secRaceDay">
      <h2 data-i18n="raceDayArrangement">Race Day Arrangement</h2>
      <div class="grid-2">
        <div class="kv"><div class="k" data-i18n="athleteMarquee">Athlete Marquee</div><div class="v" id="sumMarquee">—</div></div>
        <div class="kv"><div class="k" data-i18n="steersmanWithBoat">Official Steersman (With Practice)</div><div class="v" id="sumSteerWith">—</div></div>
        <div class="kv"><div class="k" data-i18n="steersmanNoBoat">Official Steersman (Without Practice)</div><div class="v" id="sumSteerWithout">—</div></div>
        <div class="kv"><div class="k" data-i18n="junkRegistration">Junk Registration</div><div class="v" id="sumJunk">—</div></div>
        <div class="kv"><div class="k" data-i18n="speedBoatRegistration">Speed Boat Registration</div><div class="v" id="sumSpeed">—</div></div>
      </div>
    </div>

    <div class="section" id="secTotal">
      <h2 data-i18n="totalCost">Total Cost</h2>
      <div class="total-cost">
        <div class="kv"><div class="k" data-i18n="totalAmount">Total Amount</div><div class="v" id="sumTotal">HK$0</div></div>
      </div>
    </div>

    <p class="msg" id="formMsg"></p>
    <!-- 🔄 Navigation -->
    <div class="nav-buttons" style="display: flex; justify-content: space-between; gap: 1rem;">
      <button type="button" id="backBtn" data-i18n="backButton">← Back</button>
      <button type="submit" id="submitBtn" data-i18n="submitButton">Submit Application</button>
    </div>
  </div>
</template>
